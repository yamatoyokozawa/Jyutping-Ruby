<!doctype html>
<html lang="yue-Hant-HK">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px "Segoe UI", "Microsoft JhengHei UI", "Microsoft YaHei UI", "Yu Gothic UI", sans-serif; width: 260px; margin: 12px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; }
    label input[type=checkbox] { margin-top: 2px; }
    .ml span { display: block; line-height: 1.35; }
    .ml span + span { color: #555; font-size: 12px; }
    .size { margin: 10px 0; }
    .size .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    input[type=range] { flex: 1; }
    .host { color: #666; font-size: 12px; word-break: break-all; margin-left: 24px; }
    hr { border: none; border-top: 1px solid #ddd; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Jyutping Ruby</h1>
  <label><input type="checkbox" id="enabled">
    <span class="ml">
      <span lang="yue-Hant-HK">全部網站啟用</span>
      <span lang="en">Enable on all sites</span>
      <span lang="zh-Hans">在所有网站启用</span>
      <span lang="zh-Hant">在所有網站啟用</span>
      <span lang="ja">全体で有効にする</span>
    </span>
  </label>
  <label><input type="checkbox" id="siteDisabled">
    <span class="ml">
      <span lang="yue-Hant-HK">喺呢個網站停用</span>
      <span lang="en">Disable on this site</span>
      <span lang="zh-Hans">在此网站停用</span>
      <span lang="zh-Hant">在此網站停用</span>
      <span lang="ja">このサイトでは無効</span>
    </span>
  </label>
  <div class="host" id="host"></div>
  <hr>
  <label><input type="checkbox" id="showTone">
    <span class="ml">
      <span lang="yue-Hant-HK">顯示聲調數字</span>
      <span lang="en">Show tone numbers</span>
      <span lang="zh-Hans">显示声调数字</span>
      <span lang="zh-Hant">顯示聲調數字</span>
      <span lang="ja">声調の数字を表示</span>
    </span>
  </label>
  <div class="size">
    <span class="ml">
      <span lang="yue-Hant-HK">粵拼大細</span>
      <span lang="en">Jyutping size</span>
      <span lang="zh-Hans">粤拼大小</span>
      <span lang="zh-Hant">粵拼大小</span>
      <span lang="ja">ルビの大きさ</span>
    </span>
    <div class="row"><input type="range" id="rtSize" min="30" max="90" step="5"> <span id="rtSizeVal"></span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
